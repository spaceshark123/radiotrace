services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-radiotrace}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE:-radiotrace}
      CITY: ${CITY:-Atlanta}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      SPACEX_AI_API_KEY: ${SPACEX_AI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      BROADCASTIFY_API_KEY: ${BROADCASTIFY_API_KEY:-}
      BROADCASTIFY_FEED_ID: ${BROADCASTIFY_FEED_ID:-394}
      BROADCASTIFY_STREAM_URL: ${BROADCASTIFY_STREAM_URL:-}
      ENABLE_RADIO_INGESTION: ${ENABLE_RADIO_INGESTION:-true}
      RADIO_INGEST_INTERVAL_SECONDS: ${RADIO_INGEST_INTERVAL_SECONDS:-10}
      RADIO_INGEST_LIMIT: ${RADIO_INGEST_LIMIT:-5}
    ports:
      - "5050:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend/radiotrace
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAP_ID: ${VITE_GOOGLE_MAP_ID}
        VITE_RADIO_CLIP_LIST_URL: ${VITE_RADIO_CLIP_LIST_URL:-/api/radio/clips}
        VITE_RADIO_CLIP_FILE_URL: ${VITE_RADIO_CLIP_FILE_URL:-/api/radio/clips/file}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
